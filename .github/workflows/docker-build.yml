name: Docker build (single-arch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag (e.g. 1.09)
        required: true
        type: string
      publish:
        description: Publish the single-architecture image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Get version
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          perl app/scripts/check-release.pl "$RELEASE_TAG"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile --build-arg BUILD_VERSION=${{ steps.get_version.outputs.VERSION }} --build-arg VCS_REF=${{ steps.get_version.outputs.REVISION }} -t manuelrueda/pheno-ranker:${{ steps.get_version.outputs.VERSION }}-amd64 .

      - name: Login to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: inputs.publish
        run: |
          docker image push manuelrueda/pheno-ranker:${{ steps.get_version.outputs.VERSION }}-amd64
